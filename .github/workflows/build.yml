name: Build APK

on:
  push:
  workflow_dispatch: # 允许在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史和 tag，才能汇总上次发布以来的提交

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 项目未附带 Gradle Wrapper，这里直接安装指定版本的 Gradle（运行环境已预装 Android SDK）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests + release APK
        run: gradle test assembleRelease
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScreenshotTagger.apk

      # 打印签名证书指纹：每次构建都应相同，否则手机上无法覆盖安装
      - name: Print signing certificate
        run: $(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner verify --print-certs ScreenshotTagger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotTagger
          path: ScreenshotTagger.apk

      # 发布说明：上一个 build-* 版本以来的提交标题，每条一行
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'build-*' 2>/dev/null || true)
          git log ${prev:+$prev..}HEAD --no-merges --pretty='- %s' > notes.md
          cat notes.md

      # 每次编译发布一个 Release，手机可直接下载 APK，无需解压
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body_path: notes.md
          files: ScreenshotTagger.apk
          make_latest: true
