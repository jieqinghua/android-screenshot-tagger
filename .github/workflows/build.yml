name: Build APK

on:
  push:
  workflow_dispatch: # 允许在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 项目未附带 Gradle Wrapper，这里直接安装指定版本的 Gradle（运行环境已预装 Android SDK）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests + release APK
        run: gradle test assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScreenshotTagger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotTagger
          path: ScreenshotTagger.apk

      # 每次编译发布一个 Release，手机可直接下载 APK，无需解压
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ScreenshotTagger.apk
          make_latest: true
